{% extends "base.html" %}

{% block title %}Блог{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Skystore Blog</h1>
    <p class="lead">Создать блог:</p>
    <a href="{% url 'blog:blog_create' %}" class="btn btn-primary btn-lg">Создать</a>
</div>

    <div class="container">
        <div class="row text-center">
            {% if blog_list %}
                {% for blog in blog_list %}
                    {% include "blog_card.html" with blog=blog %}
                {% endfor %}
            {% else %}
                <p class="col-12">Пока нет блогов.</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
