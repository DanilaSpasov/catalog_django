{% extends "base.html" %}

{% block title %}Подтверждение удаления{{ blog.title }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white py-3">
                    <h4 class="mb-0 fw-bold">Подтверждение удаления</h4>
                </div>
                <div class="card-body text-center p-4">
                    <p class="text-muted mb-4">
                        Вы уверены, что хотите удалить объект:
                    </p>
                    <h3 class="text-danger fw-bold mb-4">{{ blog.title }}</h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg px-4">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                            <a href="{% url 'blog:blog' %}" class="btn btn-secondary btn-lg px-4">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
