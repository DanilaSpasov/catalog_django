<div class="col-4 d-flex">
    <div class="card mb-4 box-shadow product-card w-100">
        {% if blog.preview_image %}
        <img src="{{ blog.preview_image.url }}"
             class="card-img-top"
             style="max-height: 200px; width: auto; display: block; margin: 0 auto;"
             alt="{{ blog.title|truncatechars:50 }}">
        {% endif %}
        <div class="card-header">
            <h4 class="my-0 font-weight-normal">{{ blog.title|truncatechars:50 }}</h4>
        </div>
        <div class="card-body">
            <p class="product-description flex-grow-1">
                {{ blog.content|truncatechars:100 }}
            </p>
            <p class="mt-4">
                {{ blog.views_count }} просмотров
            </p>

            <a href="{% url 'blog:blog_details' blog.pk %}"
               class="btn btn-lg btn-outline-primary w-100 mt-auto">
                читать
            </a>
        </div>
    </div>
</div>
